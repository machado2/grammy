[package]
name = "grammy"
version = "0.2.0"
edition = "2021"
description = "A grammar checking desktop app powered by OpenAI"
authors = ["Grammy"]

[dependencies]
egui = "0.30"
eframe = { version = "0.30", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui_extras = { version = "0.30", default-features = false, features = ["file"] }
reqwest = { version = "0.12", features = ["json"] }
image = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1.0", features = ["v4"] }
directories = "5.0"
confy = "0.6"

[build-dependencies]
embed-manifest = "1"
embed-resource = "2"
image = "0.24"

[profile.release]
opt-level = 3
lto = true
